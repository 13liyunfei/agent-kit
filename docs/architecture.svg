<svg viewBox="0 0 680 640" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <title>agent-kit 分层架构（静态结构）</title>
  <desc>三层：使用方项目（适配与扩展）、agent-kit 能力组件（执行循环 / 质量治理 / 底座安全）、基础设施；ChatModel 为唯一模型边界。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Segoe UI',system-ui,sans-serif}
    .th{font-size:13px;font-weight:500;fill:#2C2C2A}
    .ts{font-size:11px;fill:#5F5E5A}
    .cap{font-size:11px;fill:#888780}
    .lay{font-size:14px;font-weight:600}
  </style>

  <text class="th" x="40" y="28" font-size="15">agent-kit — 分层架构（静态结构）</text>
  <text class="ts" x="40" y="46">嵌入式多 Agent 能力组件库 · 三层 + 唯一模型边界 · 纯 Java 17 零框架</text>

  <!-- LAYER 1 CONSUMER -->
  <rect x="40" y="60" width="600" height="86" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="lay" x="56" y="80" fill="#0C447C">① 使用方项目 · Consumer（适配与扩展）</text>
  <rect x="58" y="92" width="135" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="125" y="106" text-anchor="middle" dominant-baseline="central">ChatModel</text>
  <text class="ts" x="125" y="122" text-anchor="middle" dominant-baseline="central">一行适配 LLM</text>
  <rect x="205" y="92" width="135" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="272" y="106" text-anchor="middle" dominant-baseline="central">FindingLike</text>
  <text class="ts" x="272" y="122" text-anchor="middle" dominant-baseline="central">领域发现接入评估</text>
  <rect x="352" y="92" width="135" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="419" y="106" text-anchor="middle" dominant-baseline="central">SPI 扩展注册</text>
  <text class="ts" x="419" y="122" text-anchor="middle" dominant-baseline="central">自定义行为叠加</text>
  <rect x="499" y="92" width="125" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="561" y="106" text-anchor="middle" dominant-baseline="central">业务编排</text>
  <text class="ts" x="561" y="122" text-anchor="middle" dominant-baseline="central">组合使用组件</text>
  <path class="a" d="M340 146 L340 158" stroke="#185FA5"/>

  <!-- MODEL BOUNDARY -->
  <text class="cap" x="40" y="156" fill="#993C1D">ChatModel.chat(String) / stream() —— 唯一模型边界</text>

  <!-- LAYER 2 KIT CAPABILITIES -->
  <rect x="40" y="168" width="600" height="330" rx="14" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="lay" x="56" y="188" fill="#3B6D11">② agent-kit 能力组件（14 组件 / 6 包）</text>
  <rect x="58" y="198" width="280" height="130" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="74" y="216" fill="#27500A">执行循环</text>
  <text class="ts" x="74" y="234">• toolcalling：ToolCallingLoop 决策循环</text>
  <text class="ts" x="74" y="252">• mcp：McpClient 工具生态接入</text>
  <text class="ts" x="74" y="270">• planning：TaskPlanner 拆解 → DagExecutor</text>
  <text class="ts" x="74" y="288">• session/stream：多轮上下文 · 流式输出</text>
  <rect x="352" y="198" width="280" height="130" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="368" y="216" fill="#27500A">质量与治理</text>
  <text class="ts" x="368" y="234">• eval：LlmJudge + EvalDataset 回归基准</text>
  <text class="ts" x="368" y="252">• obs：GenAiTracer 可观测 / 成本指标</text>
  <text class="ts" x="368" y="270">• checkpoint：检查点持久化 · 断点续跑</text>
  <text class="ts" x="368" y="288">• hitl：ApprovalGate 人机协作审批</text>
  <rect x="58" y="340" width="280" height="142" rx="10" fill="#FDF6E3" stroke="#BA7517" stroke-width="0.8"/>
  <text class="th" x="74" y="358" fill="#854F0B">底座与安全</text>
  <text class="ts" x="74" y="376">• extension：ExtensionRegistry + 5 类 SPI</text>
  <text class="ts" x="74" y="394">• router：ModelRouter 多模型路由 · failover</text>
  <text class="ts" x="74" y="412">• struct：StructuredChatModel 结构化输出</text>
  <text class="ts" x="74" y="430">• security：注入检测 · 拦截器防护</text>
  <rect x="352" y="340" width="280" height="142" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
  <text class="th" x="368" y="358" fill="#854F0B">扩展点 SPI（5 类契约）</text>
  <text class="ts" x="368" y="376">• LlmInterceptor：LLM 调用前置/后置</text>
  <text class="ts" x="368" y="394">• RagEnhancer：检索结果增强</text>
  <text class="ts" x="368" y="412">• AgentProvider：领域 Agent 提供</text>
  <text class="ts" x="368" y="430">• MemoryStrategy / StageHook</text>
  <path class="a" d="M340 498 L340 512" stroke="#639922"/>

  <!-- LAYER 3 INFRA -->
  <rect x="40" y="512" width="600" height="88" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="lay" x="56" y="532" fill="#444441">③ 基础设施 · Infrastructure</text>
  <rect x="58" y="542" width="135" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="125" y="564" text-anchor="middle" dominant-baseline="central">JDK 17</text>
  <rect x="205" y="542" width="135" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="272" y="564" text-anchor="middle" dominant-baseline="central">jackson-databind</text>
  <rect x="352" y="542" width="135" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="419" y="564" text-anchor="middle" dominant-baseline="central">slf4j</text>
  <rect x="499" y="542" width="125" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="561" y="564" text-anchor="middle" dominant-baseline="central">使用方存储</text>

  <text class="cap" x="40" y="618">组件间通过纯 Java API 协作（无 Spring / 无运行时依赖）；使用方经 ChatModel 边界 + SPI 扩展点接入，任意多 Agent 项目可直接复用。</text>
</svg>
