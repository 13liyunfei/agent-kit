<svg viewBox="0 0 1080 660" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <title>设计对比 · codex / Claude / deepseek-harness / agent-kit</title>
  <desc>八个设计维度对照四个实现：codex、Claude Agent SDK、deepseek-harness、agent-kit。三家为运行时（机箱），agent-kit 为嵌入式库（零件箱）。</desc>
  <style>
    text{font-family:'Segoe UI',system-ui,sans-serif}
    .m1{font-size:10.5px;fill:#1F2328}
    .m2{font-size:9.5px;fill:#6B7280}
    .dl{font-size:10.5px;font-weight:500;fill:#374151}
    .fn{font-size:9px;fill:#A8ADB5}
  </style>

  <text x="40" y="28" font-size="15" font-weight="600" fill="#2C2C2A">设计对比 · codex / Claude / deepseek-harness / agent-kit</text>
  <text class="m2" x="40" y="46" fill="#5F5E5A">agent-kit 与所借鉴 harness 家族的设计取向 · 行 = 设计维度 · 列 = 四个实现（校准至 2026-09）</text>

  <rect x="164" y="58" width="210" height="72" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="164" y="58" width="5" height="72" rx="2.5" fill="#185FA5"/>
  <text x="182" y="81" font-size="13" font-weight="600" fill="#0C447C">codex</text>
  <text x="182" y="97" font-size="9.5" fill="#5F5E5A">OpenAI · Apache-2.0 · Rust 140+ crate</text>
  <text x="182" y="116" font-size="9.5" fill="#0C447C">沙箱与审批为执行层一等公民的平台</text>

  <rect x="386" y="58" width="210" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="386" y="58" width="5" height="72" rx="2.5" fill="#D85A30"/>
  <text x="404" y="81" font-size="13" font-weight="600" fill="#712B13">Claude</text>
  <text x="404" y="97" font-size="9.5" fill="#5F5E5A">Anthropic Agent SDK · TS / Python</text>
  <text x="404" y="116" font-size="9.5" fill="#712B13">hooks + 隔离式子代理的会话运行时</text>

  <rect x="608" y="58" width="210" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="608" y="58" width="5" height="72" rx="2.5" fill="#0F6E56"/>
  <text x="626" y="81" font-size="13" font-weight="600" fill="#085041">deepseek-harness</text>
  <text x="626" y="97" font-size="9.5" fill="#5F5E5A">DeepSeek · TS · Cordis 插件框架</text>
  <text x="626" y="116" font-size="9.5" fill="#085041">以评测与回放为中心的事件源框架</text>

  <rect x="830" y="58" width="210" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="830" y="58" width="5" height="72" rx="2.5" fill="#534AB7"/>
  <text x="848" y="81" font-size="13" font-weight="600" fill="#3C3489">agent-kit</text>
  <text x="848" y="97" font-size="9.5" fill="#5F5E5A">自研 · 纯 Java 17 · 20 包</text>
  <text x="848" y="116" font-size="9.5" fill="#3C3489">无运行时、无沙箱的认知积木库</text>

  <text class="dl" x="50" y="168">会话模型</text>
  <text class="m1" x="178" y="167">Thread / Turn / Item</text>
  <text class="m2" x="178" y="182">SQLite + rollout JSONL 双持久层</text>
  <text class="m1" x="400" y="167">Session（JSONL）</text>
  <text class="m2" x="400" y="182">resume / fork · 自动压缩</text>
  <text class="m1" x="622" y="167">Session 事件源</text>
  <text class="m2" x="622" y="182">append-only 不可变日志</text>
  <text class="m1" x="844" y="167">GraphState 状态机</text>
  <text class="m2" x="844" y="182">预算护栏 · 节点重试</text>
  <line x1="40" y1="194" x2="1040" y2="194" stroke="#E9EBEE" stroke-width="0.5"/>

  <rect x="40" y="194" width="1000" height="48" fill="#FAFAF9"/>
  <text class="dl" x="50" y="216">断点续跑</text>
  <text class="m1" x="178" y="215">一等公民</text>
  <text class="m2" x="178" y="230">fork / rollback · 进程重启安全</text>
  <text class="m1" x="400" y="215">session_id 续跑</text>
  <text class="m2" x="400" y="230">跨进程持久层需自建</text>
  <text class="m1" x="622" y="215">Session 可恢复</text>
  <text class="m2" x="622" y="230">框架自带</text>
  <text class="m1" x="844" y="215">约定非保证</text>
  <text class="m2" x="844" y="230">宿主逐点 save，漏则断链</text>
  <line x1="40" y1="242" x2="1040" y2="242" stroke="#E9EBEE" stroke-width="0.5"/>

  <text class="dl" x="50" y="264">编排模型</text>
  <text class="m1" x="178" y="263">层级 spawn_agent</text>
  <text class="m2" x="178" y="278">与主循环同一事件总线</text>
  <text class="m1" x="400" y="263">隔离式 subagent</text>
  <text class="m2" x="400" y="278">独立上下文 · 父代理合并</text>
  <text class="m1" x="622" y="263">agent-team + 信箱</text>
  <text class="m2" x="622" y="278">TeamMailbox：不丢 / 不重 / 有序</text>
  <text class="m1" x="844" y="263">Supervisor + handoff</text>
  <text class="m2" x="844" y="278">Graph HITL 中断 · 审批点</text>
  <line x1="40" y1="290" x2="1040" y2="290" stroke="#E9EBEE" stroke-width="0.5"/>

  <rect x="40" y="290" width="1000" height="48" fill="#FAFAF9"/>
  <text class="dl" x="50" y="312">安全模型</text>
  <text class="m1" x="178" y="311">OS 沙箱一等公民</text>
  <text class="m2" x="178" y="326">Seatbelt / bwrap / 审批分级</text>
  <text class="m1" x="400" y="311">白名单 + 沙箱 + hooks</text>
  <text class="m2" x="400" y="326">Deny / 改写入参 · 纵深防御</text>
  <text class="m1" x="622" y="311">fail-closed</text>
  <text class="m2" x="622" y="326">沙箱不可用即拒绝执行</text>
  <text class="m1" x="844" y="311">策略层（无 OS 隔离）</text>
  <text class="m2" x="844" y="326">GuardedTool · 注入检测</text>
  <line x1="40" y1="338" x2="1040" y2="338" stroke="#E9EBEE" stroke-width="0.5"/>

  <text class="dl" x="50" y="360">上下文管理</text>
  <text class="m1" x="178" y="359">工具结果落盘 · 路径回注</text>
  <text class="m2" x="178" y="374">AGENTS.md 常驻指令</text>
  <text class="m1" x="400" y="359">文件系统即记忆</text>
  <text class="m2" x="400" y="374">渐进披露 · 子代理省上下文</text>
  <text class="m1" x="622" y="359">—</text>
  <text class="m1" x="844" y="359">窗口 / RAG / 影响面切片</text>
  <text class="m2" x="844" y="374">记忆策略全部接口化</text>
  <line x1="40" y1="386" x2="1040" y2="386" stroke="#E9EBEE" stroke-width="0.5"/>

  <rect x="40" y="386" width="1000" height="48" fill="#FAFAF9"/>
  <text class="dl" x="50" y="408">工具执行</text>
  <text class="m1" x="178" y="407">apply_patch · shell · REPL</text>
  <text class="m2" x="178" y="422">MCP client + server · BM25 找工具</text>
  <text class="m1" x="400" y="407">内置 FS / Shell / Web</text>
  <text class="m2" x="400" y="422">@tool → 进程内 MCP</text>
  <text class="m1" x="622" y="407">插件表按名路由</text>
  <text class="m2" x="622" y="422">未注册即 fail-fast</text>
  <text class="m1" x="844" y="407">双模 tool-calling</text>
  <text class="m2" x="844" y="422">MCP stdio / HTTP 客户端</text>
  <line x1="40" y1="434" x2="1040" y2="434" stroke="#E9EBEE" stroke-width="0.5"/>

  <text class="dl" x="50" y="456">评测与观测</text>
  <text class="m1" x="178" y="455">rollout 可回放复现</text>
  <text class="m1" x="400" y="455">会话 JSONL 可审查</text>
  <text class="m2" x="400" y="470">评测靠外部体系</text>
  <text class="m1" x="622" y="455">llm-replay 为核心</text>
  <text class="m2" x="622" y="470">框架即为评测而生</text>
  <text class="m1" x="844" y="455">EvalRunner + LlmJudge</text>
  <text class="m2" x="844" y="470">数据集回归 · GenAiTracer</text>
  <line x1="40" y1="482" x2="1040" y2="482" stroke="#E9EBEE" stroke-width="0.5"/>

  <rect x="40" y="482" width="1000" height="48" fill="#FAFAF9"/>
  <text class="dl" x="50" y="504">模型绑定</text>
  <text class="m1" x="178" y="503">仅 Responses API</text>
  <text class="m2" x="178" y="518">provider 可插拔（ollama 等）</text>
  <text class="m1" x="400" y="503">锁 Claude</text>
  <text class="m2" x="400" y="518">Bedrock / Vertex 可代管</text>
  <text class="m1" x="622" y="503">厂商无关</text>
  <text class="m2" x="622" y="518">OpenAI 兼容即可接入</text>
  <text class="m1" x="844" y="503">厂商无关</text>
  <text class="m2" x="844" y="518">ChatModel 单接口即边界</text>

  <rect x="40" y="546" width="1000" height="76" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="56" y="567" font-size="12" font-weight="600" fill="#3C3489">结论 · 四个物种，两个阵营</text>
  <text x="56" y="585" font-size="10.5" fill="#2C2C2A">codex / Claude / dsh 是<tspan font-weight="600">运行时（机箱）</tspan>——从执行环境向下做安全与恢复；agent-kit 是<tspan font-weight="600">库（零件箱）</tspan>——从代码向上补认知。</text>
  <text x="56" y="603" font-size="10.5" fill="#2C2C2A">Java 服务要「codex 级纵深 + kit 级嵌入」= kit 认知积木 + 宿主补 codex 式纪律（沙箱 fail-closed · 审批分级 · 快照续跑 · 轨迹回放）。</text>

  <text class="fn" x="40" y="646">校准来源：openai/codex 源码剖析 · Anthropic Claude Agent SDK 官方设计 · deepseek-harness 逐文件剖析（agentic-harness-arch）</text>
  <text class="fn" x="1040" y="646" text-anchor="end">agent-kit · 2026-09</text>
</svg>